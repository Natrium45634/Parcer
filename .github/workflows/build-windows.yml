# Сборка готовой программы для Windows.
#
# Здесь из исходников делается один-единственный файл «Хронист.exe»:
# запускается двойным щелчком, Python на машине не нужен.
#
# Собранный файл лежит во вкладке Actions этого репозитория: откройте
# последний успешный запуск и скачайте артефакт «Хронист-Windows».
# А если поставить метку версии (git tag v1.0), тот же файл ляжет
# в раздел Releases.

name: Хронист для Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Выложить готовую программу в Releases"
        type: boolean
        default: false
      tag:
        description: "Метка версии выпуска"
        default: "v1.0"

permissions:
  contents: write        # чтобы готовый файл лёг в раздел Releases

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить сборщик
        run: python -m pip install --upgrade pip pyinstaller==6.11.1

      - name: Быстрая проверка движка
        run: python main.py --cli --seed "СБОРКА" --years 300 --out check.txt

      - name: Собрать один файл
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Chronist
          --icon assets/icon.ico
          --add-data "assets;assets"
          --add-data "maps;maps"
          --collect-submodules worldgen
          --collect-submodules gui
          main.py

      - name: Назвать по-человечески
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Chronist.exe "release/Хронист.exe"
          Copy-Item dist/Chronist.exe "release/Chronist.exe"
          Copy-Item "ЧИТАТЬ ПЕРВЫМ.txt" release/ -ErrorAction SilentlyContinue
          Copy-Item "ВОЗМОЖНОСТИ.txt" release/ -ErrorAction SilentlyContinue
          # В выпуске GitHub выбрасывает из имён всё, кроме латиницы:
          # «Хронист.exe» превращается в «default.exe». Поэтому файлы
          # выпуска называются латиницей — ссылка читается глазами.
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item dist/Chronist.exe "release-files/Chronist.exe"
          Copy-Item "ЧИТАТЬ ПЕРВЫМ.txt" "release-files/README-Hronist.txt" -ErrorAction SilentlyContinue
          Copy-Item "ВОЗМОЖНОСТИ.txt" "release-files/Hronist-features.txt" -ErrorAction SilentlyContinue

      - name: Выложить готовую программу
        uses: actions/upload-artifact@v4
        with:
          name: Хронист-Windows
          path: release/*
          retention-days: 90

      - name: Прибрать прежний выпуск под той же меткой
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Метку не трогаем: без неё GitHub оставляет новый выпуск
        # черновиком, и ссылка на скачивание не работает.
        run: gh release delete "${{ inputs.tag }}" --yes || true

      - name: Приложить к релизу
        if: >
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          make_latest: "true"
          tag_name: >-
            ${{ startsWith(github.ref, 'refs/tags/v')
                && github.ref_name || inputs.tag }}
          name: >-
            Хронист ${{ startsWith(github.ref, 'refs/tags/v')
                        && github.ref_name || inputs.tag }}
          body: |
            **Хронист** — генератор фэнтезийных историй.

            Скачайте `Chronist.exe` и запустите двойным щелчком: ни Python,
            ни библиотек ставить не нужно. Файл можно переименовать хоть
            в «Хронист.exe» и положить куда угодно.

            Программа открывается мастером создания мира: сид и длительность,
            76 шкал настроек с замками, гексовая карта Worldforge со своими
            18 ползунками и предпросмотром, кнопка «Создать мир» — и летопись
            на 60 разделов.

            Три из них стоит открыть первыми:

            * **История мира** — вся летопись с отбором: за какие годы,
              насколько важное, о чём, на какой земле, у какой державы и по
              какому слову; оттуда же «отчего это вышло» и переход на карту.
            * **Карта мира** — двенадцать слоёв (биомы, рельеф с подсветкой
              склонов, державы по годам, плодородие, магия, тепло, влага…),
              реки, подписи морей и материков, вершины и вулканы, границы
              держав, ползунок года. Щелчок по гексу рассказывает о месте
              всё — вплоть до того, кто владел этой землёй в выбранный год и
              какая беда по ней прошла.
            * **Временная шкала** — весь мир на один названный год.

            ### Что нового в этой версии

            Версия большая: одиннадцать новых пластов мира и отдельный
            раздел, которым мир можно разобрать, не выходя из программы.

            **Начало мира.** Мир больше не начинается со вступления. У него
            есть мотив творения (цена, недоделка, тюрьма, убежище,
            украденное творение — всего четырнадцать) и слои, положенные в
            определённом порядке: мир, где смерть старше жизни, — другой
            мир, а мир без сна, без души или без магии — не обеднённый, а
            другой. О каждом слое был спор, и чем он кончился — осталось
            законом («мёртвые не возвращаются», «магия берёт плату») и
            шрамом в настоящей земле, до которого можно дойти ногами.
            Отдельно от того, что было, стоит то, что об этом знают: доля
            правды, версии каждого народа и противоречия, которые генератор
            не обязан разрешать.

            **Земля.** У всякого гекса карты теперь есть своя страница:
            чем тут кормиться, крут ли склон, можно ли зимовать, чем грозит
            округа — словами, а не числами. Рядом — вес места в истории,
            собранный из настоящих следов, и летопись гекса по годам.
            Главный же вопрос о месте — когда сюда впервые ступила нога, и
            ответов на него пять: первым тут прошли одни, первыми осели
            другие, первой пришла держава, а записал это четвёртый через
            тысячу лет. У всякого «первого» названо, откуда оно известно:
            раскоп даёт век вместо года и имени не называет вовсе. Поэтому
            у места два слоя — что о нём знают и как было на самом деле, —
            и у старого забытого места они расходятся.

            **Города стали редкостью.** Хлеб у земли один на все её города,
            и делят они его по старшинству, а не поровну. Новый город
            встаёт не всякий год, а только там, где после него каждому
            хватит на целый город; племя, которому селиться негде, приходит
            в готовый город и делает его больше. Отсюда мир, в котором
            городов меньше, а большие города в нём есть.

            **Виды существ.** «Дракон» — не уровень силы, а вид, и внутри
            него есть биологические ступени, подвиды и единственные в своём
            роде особи. Ступень не бросается при появлении, а набирается
            годами, налётами и съеденными — вот почему великих в мире
            единицы. И разумность теперь история вида, а не графа
            справочника: орки, гоблины, тролли, огры, кобольды и гноллы
            могут оказаться в мире зверьём — тогда раса не просыпается
            вовсе. Зверьё может поумнеть, а народ одичать, и у перемены
            всегда названа причина.

            **Чудеса света.** Чудом место делают люди, а не карта:
            величайший водопад стоит с первого года, но чудом его называют
            тем веком, когда в эту землю пришли жить. Оснований двенадцать,
            и «за величину» — только одно из них. Дальше чудо живёт: слава
            ходит вверх и вниз, беда берёт его по своей графе, утраченное
            находят через века, а иное оказывается не чудом вовсе.

            **Владения чудовищ.** Земля, у которой хозяин не человек: ни
            столицы, ни казны, ни закона — логово, способ держать,
            повинность и те, кто под этим живёт. Владение не ставят, оно
            вырастает из уже случившейся беды или павшей державы, а размах
            считается из силы хозяина: дракон, желающий тишины, получает
            две долины. Соседи терпят владение по названной причине — и
            триста лет такого соседства не недосмотр, а история.

            **Праздники.** Праздник вырос из события, к которому решили
            возвращаться каждый год, и дальше пошёл сам. Форма переживает
            смысл: сперва жгли чучело врага, через семьсот лет дети прыгают
            через костёр, через тысячу никто не знает, почему костёр. Дни
            запрещали с названной причиной, они уходили в подполье и
            возвращались другими; победители празднуют, побеждённые
            оплакивают.

            **Обычаи.** «Гномы чтут камень» — не запись о мире; запись —
            «в Долгом Броде после третьего обвала стали резать имена
            погибших на плите у входа». Обычай не берётся из списка
            традиций: сперва задача, которую надо решить, потом форма, на
            которой в этих условиях есть чему держаться. Поэтому два народа
            одной расы получают разные культуры. И обычай не диктует
            поступок: отношений к нему пятнадцать, кто-то хранит
            запрещённое, кто-то ломает при свидетелях — и от последнего
            обычай меняется.

            **Познание мира.** Неизвестность всегда чья-то: землю нельзя
            пометить неведомой вообще — она неведома такой-то державе и
            прекрасно известна тем, кто на ней живёт. У похода есть повод,
            случившийся в этом мире, а исход — не «удача или неудача»:
            опровергнутая карта и подтверждённое «там ничего нет» тоже
            работа. Найти не значит понять, а первенство бывает трёх родов
            — кто дошёл, чья запись уцелела и кого принято считать первым, —
            и расходятся они постоянно.

            **Вещи.** У предмета появились материал со своей судьбой (жилу
            находят, беда заваливает выработку, мастера умирают — и через
            тысячу лет найденный клинок приписывают богам), состав из
            частей, биография по годам с графой «знают ли», отрезки утраты
            с причиной и не всегда с находкой, двенадцать мер ценности,
            которые спорят между собой, предания с подлинностью и копии,
            живущие своей жизнью. Сломанный кинжал ничего не стоит на торгу
            и остаётся главной святыней державы.

            **Отчего они умерли.** Причина смерти выводится из того,
            сколько человек прожил своего века, чем занимался, какого он
            пола и знает ли об этом вообще кто-нибудь. У тех, кто смертным
            не ровня, важно не слово, а насовсем ли, и кончаются они по
            своей графе: великий демон не гибнет в обвале в горах.

            **Разбор мира — кнопкой.** Новый раздел отвечает на вопрос «что
            это за мир получился»: приговор миру (холодный или жаркий,
            много ли суши, какая у него судьба, чем он опасен, сколько в
            нём волшебства, кто проснулся и кто вышел зверьём), пять
            памятных дат, двенадцать портретов — величайшие имена, ушедшие
            народы, старейший город, тяжелейшее время, дракон или бог,
            самое знаменитое чудо и тот, кто узнал мир, — итог числами и
            проверка на поломки. Работает и на мире, прочитанном из файла.

            Постоянная ссылка на последнюю версию:
            https://github.com/Natrium45634/Parcer/releases/latest/download/Chronist.exe

            При первом запуске Windows может предупредить о неизвестном
            издателе: «Подробнее» → «Выполнить в любом случае».

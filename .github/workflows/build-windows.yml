# Сборка готовой программы для Windows.
#
# Здесь из исходников делается один-единственный файл «Хронист.exe»:
# запускается двойным щелчком, Python на машине не нужен.
#
# Собранный файл лежит во вкладке Actions этого репозитория: откройте
# последний успешный запуск и скачайте артефакт «Хронист-Windows».
# А если поставить метку версии (git tag v1.0), тот же файл ляжет
# в раздел Releases.

name: Хронист для Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Выложить готовую программу в Releases"
        type: boolean
        default: false
      tag:
        description: "Метка версии выпуска"
        default: "v1.0"

permissions:
  contents: write        # чтобы готовый файл лёг в раздел Releases

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить сборщик
        run: python -m pip install --upgrade pip pyinstaller==6.11.1

      - name: Быстрая проверка движка
        run: python main.py --cli --seed "СБОРКА" --years 300 --out check.txt

      - name: Собрать один файл
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Chronist
          --icon assets/icon.ico
          --add-data "assets;assets"
          --add-data "maps;maps"
          --collect-submodules worldgen
          --collect-submodules gui
          main.py

      - name: Назвать по-человечески
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Chronist.exe "release/Хронист.exe"
          Copy-Item dist/Chronist.exe "release/Chronist.exe"
          Copy-Item "ЧИТАТЬ ПЕРВЫМ.txt" "release/ЧИТАТЬ-ПЕРВЫМ.txt" -ErrorAction SilentlyContinue
          Copy-Item "ВОЗМОЖНОСТИ.txt" release/ -ErrorAction SilentlyContinue

      - name: Выложить готовую программу
        uses: actions/upload-artifact@v4
        with:
          name: Хронист-Windows
          path: release/*
          retention-days: 90

      - name: Приложить к релизу
        if: >
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          make_latest: "true"
          tag_name: >-
            ${{ startsWith(github.ref, 'refs/tags/v')
                && github.ref_name || inputs.tag }}
          name: >-
            Хронист ${{ startsWith(github.ref, 'refs/tags/v')
                        && github.ref_name || inputs.tag }}
          body: |
            **Хронист** — генератор фэнтезийных историй.

            Скачайте `Хронист.exe` и запустите двойным щелчком: ни Python,
            ни библиотек ставить не нужно. Тот же файл под латинским
            именем — `Chronist.exe`.

            Программа открывается мастером создания мира: сид и длительность,
            68 шкал настроек с замками, своя гексовая карта с предпросмотром,
            кнопка «Создать мир» — и летопись на 38 вкладок.

            При первом запуске Windows может предупредить о неизвестном
            издателе: «Подробнее» → «Выполнить в любом случае».
